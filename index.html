  <body>
    <noscript>Site Measure heeft JavaScript nodig.</noscript>
    <div id="root"></div>
    <script>
      // Offline app shell (public/sw.js). Not on the Metro dev server, where bundles change constantly.
      // When a newer build has been installed in the background, a bar offers to reload into it.
      (function () {
        if (!('serviceWorker' in navigator) || (location.hostname === 'localhost' && location.port === '8081')) return;
        function showUpdate() {
          if (document.getElementById('sm-update')) return;
          var bar = document.createElement('div');
          bar.id = 'sm-update';
          bar.style.cssText =
            'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;display:flex;align-items:center;gap:12px;padding:12px 14px;' +
            'background:#0E1822;border:1px solid rgba(24,191,255,0.35);border-radius:14px;color:#E8F2F8;font:14px/1.4 "IBM Plex Sans",system-ui,sans-serif;' +
            'box-shadow:0 12px 40px rgba(0,0,0,0.5);max-width:520px;margin:0 auto';
          bar.innerHTML =
            '<span style="flex:1">Er staat een nieuwe versie van Site Measure klaar.</span>' +
            '<button type="button" style="background:#18BFFF;color:#00131C;border:0;border-radius:999px;padding:9px 16px;font:600 14px \'IBM Plex Sans\',system-ui,sans-serif;cursor:pointer">Vernieuwen</button>';
          bar.querySelector('button').onclick = function () {
            location.reload();
          };
          document.body.appendChild(bar);
        }
        function watch(worker) {
          worker.addEventListener('statechange', function () {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) showUpdate();
          });
        }
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              if (reg.waiting && navigator.serviceWorker.controller) showUpdate();
              if (reg.installing) watch(reg.installing);
              reg.addEventListener('updatefound', function () {
                if (reg.installing) watch(reg.installing);
              });
              // Look for a newer build whenever the app comes back to the foreground.
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') reg.update().catch(function () {});
              });
            })
            .catch(function () {});
        });
      })();
    </script>
