      rel="stylesheet"
    />
    <script>
      // Paint the chosen theme before the bundle loads, so the page never flashes. Same key as src/ui/theme.ts.
      (function () {
        var dark = false;
        try {
          var pref = localStorage.getItem('siteMeasure.theme');
          dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#18191C' : '#FFFFFF');
      })();
    </script>
    <style id="expo-reset">
      /* Same tokens as src/ui/theme.ts */
      :root {
        --bg: #f4f1ec;
        --text: #18191b;
        --placeholder: #9ba0a6;
        --accent: #ea580c;
        --glow: rgba(234, 88, 12, 0.07);
        color-scheme: light;
      }
      html[data-theme='dark'] {
        --bg: #121315;
        --text: #f3f2ef;
        --placeholder: #6f757c;
        --accent: #f97316;
        --glow: rgba(249, 115, 22, 0.1);
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
        -webkit-text-size-adjust: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        background-image: radial-gradient(900px 520px at 88% -12%, var(--glow), transparent 60%);
        background-repeat: no-repeat;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      * {
        -webkit-tap-highlight-color: transparent;
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--placeholder);
      }
      input:focus,
      textarea:focus {
        outline: none;
        border-color: var(--accent) !important;
        box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.18);
      }
      ::selection {
        background: rgba(234, 88, 12, 0.25);
      }
    </style>
  <link rel="icon" href="/favicon.ico"/></head>
  <body>
    <noscript>Site Measure heeft JavaScript nodig.</noscript>
    <div id="root"></div>
    <script>
      // Offline app shell (public/sw.js). Not on the Metro dev server, where bundles change constantly.
      // When a newer build has been installed in the background, a bar offers to reload into it.
      (function () {
        if (!('serviceWorker' in navigator) || (location.hostname === 'localhost' && location.port === '8081')) return;
        function showUpdate() {
          if (document.getElementById('sm-update')) return;
          var dark = document.documentElement.getAttribute('data-theme') === 'dark';
          var bar = document.createElement('div');
          bar.id = 'sm-update';
          bar.style.cssText =
            'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;display:flex;align-items:center;gap:12px;padding:12px 14px;' +
            'background:' + (dark ? '#1E2024' : '#FFFFFF') + ';border:1px solid ' + (dark ? 'rgba(255,255,255,0.14)' : 'rgba(24,25,27,0.12)') + ';border-radius:16px;color:' + (dark ? '#F3F2EF' : '#18191B') + ';' +
            'font:14px/1.4 "Inter",system-ui,sans-serif;box-shadow:0 12px 40px rgba(0,0,0,0.25);max-width:520px;margin:0 auto';
          bar.innerHTML =
            '<span style="flex:1">Er staat een nieuwe versie van Site Measure klaar.</span>' +
            '<button type="button" style="background:#EA580C;color:#1B1007;border:0;border-radius:12px;padding:10px 16px;font:600 14px \'Inter\',system-ui,sans-serif;cursor:pointer">Vernieuwen</button>';
          bar.querySelector('button').onclick = function () {
            location.reload();
          };
          document.body.appendChild(bar);
        }
        function watch(worker) {
          worker.addEventListener('statechange', function () {
            if (worker.state === 'installed' && navigator.serviceWorker.controller) showUpdate();
          });
        }
        window.addEventListener('load', function () {
          navigator.serviceWorker
            .register('/sw.js')
            .then(function (reg) {
              if (reg.waiting && navigator.serviceWorker.controller) showUpdate();
              if (reg.installing) watch(reg.installing);
              reg.addEventListener('updatefound', function () {
                if (reg.installing) watch(reg.installing);
              });
              // Look for a newer build whenever the app comes back to the foreground.
              document.addEventListener('visibilitychange', function () {
                if (document.visibilityState === 'visible') reg.update().catch(function () {});
              });
            })
            .catch(function () {});
        });
      })();
    </script>
